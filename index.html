<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ngapori Ranch Planting Calendar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --bg: #E7E2CE;
    --paper: #FBF8EF;
    --ink: #262F1F;
    --ink-soft: #5B5942;
    --green: #3C5A3E;
    --green-dark: #25381F;
    --mustard: #C4922B;
    --clay: #A8472E;
    --line: #CFC8AA;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    margin: 0;
  }

  .display-font { font-family: 'Roboto Slab', serif; }
  .mono-font { font-family: 'IBM Plex Mono', monospace; }

  .icon { display: inline-flex; flex-shrink: 0; }
  .icon svg { width: 1em; height: 1em; }

  button { font-family: inherit; }

  .packet-card {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }
  .packet-card::before {
    content: "";
    position: absolute;
    top: -1px; left: 10px; right: 10px;
    height: 8px;
    background-image: radial-gradient(circle at 6px 0px, transparent 4px, var(--bg) 4.5px);
    background-size: 12px 8px;
    background-repeat: repeat-x;
  }
  .packet-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(38,47,31,0.18);
  }
  .stamp {
    position: absolute;
    top: 10px; right: -6px;
    transform: rotate(8deg);
    border: 2px dashed var(--clay);
    color: var(--clay);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 3px;
    background: rgba(168,71,46,0.06);
  }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(38,47,31,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 50; backdrop-filter: blur(1px);
  }
  .modal-card {
    background: var(--paper);
    border-radius: 8px;
    max-width: 640px; width: 100%;
    max-height: 85vh; overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .glossary-row + .glossary-row { border-top: 1px solid var(--line); }
  .crop-row:hover { background: var(--bg); }
  ::selection { background: var(--mustard); color: var(--green-dark); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }

  .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .title-row h1 { font-size: 28px; font-weight: 700; color: var(--green-dark); margin: 0; }
  .subtitle { color: var(--ink-soft); margin-top: 6px; font-size: 15px; max-width: 520px; }
  .header-actions { display: flex; gap: 10px; }
  .btn-secondary {
    display: flex; align-items: center; gap: 6px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 6px; padding: 9px 14px; font-size: 13.5px; font-weight: 600;
    color: var(--green); cursor: pointer;
  }

  .sync-banner { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 12.5px; color: var(--ink-soft); }
  .sync-banner.fallback { color: var(--clay); }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .link-btn { background: none; border: none; text-decoration: underline; color: var(--clay); cursor: pointer; font-size: 12.5px; padding: 0; }

  .due-bar {
    background: var(--green-dark); border-radius: 8px; padding: 18px 22px; margin-bottom: 28px;
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap; color: var(--paper);
  }
  .due-bar .due-label-block { display: flex; align-items: center; gap: 10px; min-width: 180px; }
  .due-bar .due-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #C9C4A8; }
  .due-bar .due-month { font-size: 19px; font-weight: 700; }
  .due-bar .due-desc { flex: 1; min-width: 240px; font-size: 13.5px; line-height: 1.5; color: #DCD8C0; }
  .due-bar .due-btn {
    background: var(--mustard); color: var(--green-dark); border: none;
    border-radius: 6px; padding: 10px 16px; font-weight: 700; font-size: 13.5px;
    cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }

  .year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .month-card { padding: 20px 18px 16px; }
  .month-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .month-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .month-name { font-size: 19px; font-weight: 700; color: var(--green-dark); }
  .month-stats { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .month-stats .row { display: flex; justify-content: space-between; color: var(--ink-soft); }
  .month-stats .row .val { font-weight: 600; }
  .month-stats .total {
    border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 6px;
    display: flex; justify-content: space-between; font-weight: 700; color: var(--ink);
  }

  .footnote { font-size: 12.5px; color: var(--ink-soft); margin-top: 24px; line-height: 1.6; max-width: 720px; }

  .modal-header {
    padding: 22px 24px 16px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--paper);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .modal-eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .modal-title { font-size: 24px; font-weight: 700; color: var(--green-dark); margin: 2px 0 0; }
  .close-btn { background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 4px; display: flex; }

  .modal-body { padding: 8px 24px 24px; }

  .zone-pill {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; margin-bottom: 4px;
    background: var(--bg); border-radius: 20px; padding: 5px 10px 5px 12px; font-size: 12.5px; color: var(--ink);
  }
  .zone-pill button { background: none; border: none; cursor: pointer; color: var(--ink-soft); display: flex; padding: 2px; }

  .group-block { margin-top: 18px; }
  .group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .group-title { font-weight: 700; font-size: 14.5px; }
  .group-list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .crop-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 14px 11px 12px; cursor: pointer;
  }
  .crop-row .left { display: flex; align-items: center; gap: 10px; }
  .crop-emoji { font-size: 20px; line-height: 1; }
  .crop-name { font-weight: 600; font-size: 14.5px; }
  .crop-window { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .crop-row .right { display: flex; align-items: center; gap: 10px; }
  .crop-beds { font-size: 12.5px; color: var(--green); font-weight: 600; }

  .map-caption { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; }
  .map-legend .item { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); }
  .map-legend .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .map-legend .note { color: var(--ink-soft); font-style: italic; }

  .crop-detail-header { padding: 22px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; }
  .crop-detail-title-row { display: flex; align-items: center; gap: 10px; }
  .crop-detail-emoji { font-size: 26px; line-height: 1; }
  .crop-detail-title { font-size: 21px; font-weight: 700; color: var(--green-dark); margin: 0; }
  .crop-detail-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; }

  .detail-row { display: flex; gap: 12px; }
  .detail-icon { width: 34px; height: 34px; border-radius: 7px; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .detail-label { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
  .detail-value { font-size: 15px; font-weight: 600; color: var(--ink); }
  .detail-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }

  .cohort-note { background: var(--bg); border-radius: 6px; padding: 12px 14px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }

  .glossary-title { font-size: 21px; font-weight: 700; color: var(--green-dark); margin: 0; }
  .glossary-body { padding: 6px 24px 22px; }
  .glossary-row { padding: 13px 0; }
  .glossary-term { font-weight: 700; font-size: 13.5px; color: var(--green); margin-bottom: 3px; }
  .glossary-meaning { font-size: 13.5px; color: var(--ink); line-height: 1.5; }

  @media (max-width: 480px) {
    .title-row h1 { font-size: 22px; }
    .due-bar { padding: 16px; }
  }
</style>
</head>

<div id="app"></div>

/* ---------- Live data source ----------
   Reads directly from the Ngapori Ranch Planting Calendar Google Sheet.
   Sheet must be shared as "Anyone with the link -> Viewer".
------------------------------------------------------------ */

function normalizeRow(row) {
  const get = (key) => (row[key] !== undefined ? String(row[key]).trim() : "");
  return {
    m: get("Month"),
    crop: get("Crop"),
    coh: get("Cohort Prefix"),
    zone: get("Target Zone"),
    ztype: get("Zone Type"),
    beds: get("Required Beds"),
    window: get("Scheduled Planting Window"),
    method: get("Propagation / Method"),
  };
}

const ZONE_LAYOUT = {
  GH1: { x: 20, y: 20, w: 70, h: 55 },
  GH2: { x: 100, y: 20, w: 70, h: 55 },
  GH4: { x: 180, y: 20, w: 70, h: 55 },
  HT1: { x: 20, y: 95, w: 44, h: 55 },
  HT2: { x: 74, y: 95, w: 44, h: 55 },
  HT3: { x: 128, y: 95, w: 44, h: 55 },
  HT4: { x: 182, y: 95, w: 44, h: 55 },
  HT5: { x: 236, y: 95, w: 44, h: 55 },
  HT6: { x: 290, y: 95, w: 44, h: 55 },
  B1: { x: 20, y: 165, w: 155, h: 65 },
  B2: { x: 190, y: 165, w: 145, h: 65 },
  B3: { x: 20, y: 240, w: 155, h: 60 },
  B4: { x: 190, y: 240, w: 145, h: 60 },
  Z5: { x: 355, y: 20, w: 265, h: 280 },
};

const GROUP_ORDER = ["Greenhouse", "High Tunnel", "Open Field", "Perennial Ground"];
const GROUP_ICON = { "Greenhouse": "home", "High Tunnel": "sun", "Open Field": "leaf", "Perennial Ground": "treePine" };
const GROUP_COLOR = { "Greenhouse": "#3C5A3E", "High Tunnel": "#8A6D2F", "Open Field": "#5C4A2E", "Perennial Ground": "#4A5A3C" };

// Small visual identifiers per crop, purely decorative — helps the list get scanned at a glance.
const CROP_ICON = {
  "Bell Pepper": "🫑", "Broccoli": "🥦", "Cabbage": "🥬", "Carrot": "🥕",
  "Cauliflower": "🥦", "Cover Crops": "🌾", "Cowpea Leaves": "🌿",
  "Cucumber / Squash": "🥒", "Eggplant": "🍆", "Field Greens": "🍃",
  "Kale": "🥬", "Lettuce": "🥬", "Mchicha": "🌿", "Mustard Greens": "🍃",
  "Okra": "🌱", "Onion": "🧅", "Plantains / Cassava / Asparagus": "🌴",
  "Potato": "🥔", "Radish": "🌱", "Spider Plant": "🌿", "Spinach": "🥬",
  "Sukuma Wiki": "🍃", "Swiss Chard": "🍃", "Tomato": "🍅",
};

// Seasonal accent colors used as a thin identifier stripe on month cards — not a full
// background swap, to keep the cards readable and consistent with the paper/ledger look.
const MONTH_ACCENT = {
  January: "#4A6FA5", February: "#4A6FA5", December: "#4A6FA5",   // winter — blue
  March: "#3C8D4A", April: "#3C8D4A", May: "#3C8D4A",             // spring — green
  June: "#C9A23F", July: "#C9A23F", August: "#C9A23F",            // summer — gold
  September: "#C97A3F", October: "#C97A3F", November: "#C97A3F", // fall — orange
};

const GLOSSARY = [
  { term: "GH", meaning: "Greenhouse — an enclosed, climate-controlled growing structure." },
  { term: "HT", meaning: "High Tunnel — a covered but unheated growing structure, warmer than open field." },
  { term: "FIELD", meaning: "Open Field — crops grown outdoors, directly in ranch soil." },
  { term: "PCS", meaning: "Planting Calendar System — this planning tool itself. It shows what to plant, where, and when." },
  { term: "Cohort code", meaning: "A batch ID for one planting round, e.g. COH-SPN-2026-001 means a Spinach cohort planted in 2026, batch 1. The last digits are filled in when that round is actually planted." },
  { term: "Ranch_AAB", meaning: "The ranch's field operations system, where the manager checks real bed availability and logs the actual planting work." },
];

function weekRank(windowText) {
  const t = windowText.toLowerCase();
  if (t.includes("1st week")) return 0;
  if (t.includes("2nd week")) return 1;
  if (t.includes("3rd week")) return 2;
  if (t.includes("4th week")) return 3;
  return 4; // whole-month field windows
}

function bedsNumber(bedsText) {
  const m = String(bedsText).match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}

function esc(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------- App state ---------- */
const today = new Date();
const currentMonth = MONTHS[today.getMonth()];
const nextMonth = MONTHS[(today.getMonth() + 1) % 12];

const state = {
  selectedMonth: null,
  selectedCrop: null, // index into monthDetail items list (by crop name+zone key), we'll store full object
  showGlossary: false,
  calendarData: [],
  loadState: "loading", // 'loading' | 'live' | 'fallback'
  lastSynced: null,
  mapZoneFilter: null,
};

function loadSheet() {
  state.loadState = "loading";
  render();
  const bustUrl = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "cb=" + Date.now();
  fetch(bustUrl)
    .then((res) => {
      if (!res.ok) throw new Error("Sheet request failed: " + res.status);
      return res.text();
    })
    .then((csvText) => {
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      const rows = parsed.data.map(normalizeRow).filter((r) => r.m && r.crop);
      if (rows.length === 0) throw new Error("Sheet returned no rows");
      state.calendarData = rows;
      state.loadState = "live";
      state.lastSynced = new Date();
      render();
    })
    .catch(() => {
      state.calendarData = SAMPLE_DATA;
      state.loadState = "fallback";
      state.lastSynced = new Date();
      render();
    });
}

/* ---------- Derived data ---------- */
function computeMonthStats() {
  const stats = {};
  MONTHS.forEach((m) => {
    const items = state.calendarData.filter((r) => r.m === m);
    const protectedCount = items.filter((r) => r.ztype === "GH/HT").length;
    const fieldCount = items.length - protectedCount;
    const totalBeds = items.reduce((sum, r) => sum + bedsNumber(r.beds), 0);
    stats[m] = { items, protectedCount, fieldCount, totalBeds };
  });
  return stats;
}

function computeZoneStats(monthDetail) {
  const stats = {};
  Object.keys(ZONE_INFO).forEach((z) => { stats[z] = { count: 0, beds: 0 }; });
  if (monthDetail) {
    monthDetail.items.forEach((item) => {
      if (!stats[item.zone]) stats[item.zone] = { count: 0, beds: 0 };
      stats[item.zone].count += 1;
      stats[item.zone].beds += bedsNumber(item.beds);
    });
  }
  return stats;
}

function computeGroupedDetail(monthDetail, zoneFilter) {
  if (!monthDetail) return [];
  const sourceItems = zoneFilter ? monthDetail.items.filter((i) => i.zone === zoneFilter) : monthDetail.items;
  const byGroup = {};
  sourceItems.forEach((item) => {
    const g = (ZONE_INFO[item.zone] && ZONE_INFO[item.zone].group) || "Open Field";
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push(item);
  });
  return GROUP_ORDER.filter((g) => byGroup[g]).map((g) => ({ group: g, items: byGroup[g] }));
}

/* ---------- Render pieces ---------- */
function renderFieldMap(zoneStats, selectedZone) {
  let rects = "";
  Object.entries(ZONE_LAYOUT).forEach(([zone, pos]) => {
    const group = (ZONE_INFO[zone] && ZONE_INFO[zone].group) || "Open Field";
    const color = GROUP_COLOR[group] || "#3C5A3E";
    const stat = zoneStats[zone] || { count: 0, beds: 0 };
    const active = stat.count > 0;
    const isSelected = selectedZone === zone;
    rects += `
      <g data-action="zone-click" data-zone="${esc(zone)}" style="cursor:pointer">
        <rect x="${pos.x}" y="${pos.y}" width="${pos.w}" height="${pos.h}" rx="5"
          fill="${color}"
          fill-opacity="${active ? (isSelected ? 0.95 : 0.75) : 0.12}"
          stroke="${isSelected ? "#262F1F" : color}"
          stroke-width="${isSelected ? 2.5 : 1}"
          stroke-opacity="${active ? 1 : 0.4}" />
        <text x="${pos.x + pos.w / 2}" y="${pos.y + pos.h / 2 - (active ? 6 : 0)}"
          text-anchor="middle" dominant-baseline="middle"
          font-size="${pos.w > 100 ? 15 : 12}" font-weight="700"
          fill="${active ? "#FBF8EF" : "#5B5942"}"
          font-family="'IBM Plex Mono', monospace">${esc(zone)}</text>
        ${active ? `<text x="${pos.x + pos.w / 2}" y="${pos.y + pos.h / 2 + 12}"
          text-anchor="middle" dominant-baseline="middle"
          font-size="10.5" fill="#FBF8EF" fill-opacity="0.9">${stat.count} ${stat.count === 1 ? "crop" : "crops"} · ${stat.beds} beds</text>` : ""}
      </g>`;
  });

  let legend = GROUP_ORDER.map((g) => `
    <div class="item"><span class="swatch" style="background:${GROUP_COLOR[g]}"></span>${esc(g)}</div>
  `).join("");

  return `
    <div>
      <div class="map-caption">Field map — where this month's planting happens</div>
      <svg viewBox="0 0 640 320" style="width:100%;height:auto;display:block">
        <rect x="0" y="0" width="640" height="320" rx="6" fill="#E7E2CE" />
        ${rects}
      </svg>
      <div class="map-legend">
        ${legend}
        <div class="note">Faded = nothing scheduled there this month · tap a block to filter the list below</div>
      </div>
    </div>
  `;
}

function renderDetailRow(iconName, label, value, sub, accentColor) {
  return `
    <div class="detail-row">
      <div class="detail-icon" style="color:${accentColor || "#3C5A3E"}">${icon(iconName, 17)}</div>
      <div>
        <div class="detail-label">${esc(label)}</div>
        <div class="detail-value">${esc(value)}</div>
        ${sub ? `<div class="detail-sub">${esc(sub)}</div>` : ""}
      </div>
    </div>
  `;
}

function render() {
  const monthStats = computeMonthStats();
  const dueNowItems = monthStats[currentMonth]
    ? [...monthStats[currentMonth].items].sort((a, b) => weekRank(a.window) - weekRank(b.window))
    : [];

  const monthDetail = state.selectedMonth ? monthStats[state.selectedMonth] : null;
  const zoneStats = computeZoneStats(monthDetail);
  const groupedDetail = computeGroupedDetail(monthDetail, state.mapZoneFilter);

  let html = `
    <div class="wrap">
      <div class="header-row">
        <div>
          <div class="title-row">
            <span class="icon" style="width:28px;height:28px;color:#3C5A3E">${ICONS.sprout}</span>
            <h1 class="display-font">Ngapori Ranch Planting Calendar</h1>
          </div>
          <p class="subtitle">What are we planting, where, and when? Click a month to see the crops, click a crop for the full detail.</p>
        </div>
        <div class="header-actions">
          <button class="btn-secondary" data-action="open-glossary">${icon("info", 16)} What do these terms mean?</button>
          <button class="btn-secondary" data-action="refresh" title="Refresh from Google Sheet">
            <span class="${state.loadState === "loading" ? "spin" : ""}" style="display:flex">${icon("refresh", 16)}</span>
          </button>
        </div>
      </div>

      <div class="sync-banner ${state.loadState === "fallback" ? "fallback" : ""}">
        ${state.loadState === "loading" ? `<span class="spin" style="display:flex">${icon("refresh", 13)}</span> Loading the latest calendar from Google Sheets…` : ""}
        ${state.loadState === "live" ? `<span class="sync-dot"></span> Live from Google Sheet${state.lastSynced ? " · synced " + state.lastSynced.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""}` : ""}
        ${state.loadState === "fallback" ? `${icon("alertTriangle", 13)} Couldn't reach the Google Sheet — showing sample data. <button class="link-btn" data-action="refresh">Try again</button>` : ""}
      </div>

      <div class="due-bar">
        <div class="due-label-block">
          ${icon("bell", 20)}
          <div>
            <div class="due-label">Due now</div>
            <div class="due-month display-font">${currentMonth}</div>
          </div>
        </div>
        <div class="due-desc">
          ${dueNowItems.length} planting ${dueNowItems.length === 1 ? "item is" : "items are"} scheduled this month across
          ${monthStats[currentMonth] ? monthStats[currentMonth].totalBeds : 0} beds. Next month (${nextMonth}) has ${monthStats[nextMonth] ? monthStats[nextMonth].items.length : 0} items lined up.
        </div>
        <button class="due-btn" data-action="open-month" data-month="${esc(currentMonth)}">See this month's work ${icon("chevronRight", 16)}</button>
      </div>

      <div class="year-grid">
        ${MONTHS.map((m) => {
          const s = monthStats[m];
          const isCurrent = m === currentMonth;
          const accent = MONTH_ACCENT[m];
          return `
            <div class="packet-card month-card" data-action="open-month" data-month="${esc(m)}" style="border-left:5px solid ${accent}">
              ${isCurrent ? `<div class="stamp">IN SEASON</div>` : ""}
              <div class="month-head">
                <span class="month-dot" style="background:${accent}"></span>
                <div class="month-name display-font">${esc(m)}</div>
              </div>
              <div class="month-stats">
                <div class="row"><span>Greenhouse &amp; High Tunnel</span><span class="val mono-font" style="color:#3C5A3E">${s.protectedCount}</span></div>
                <div class="row"><span>Open Field &amp; Perennial</span><span class="val mono-font" style="color:#A8472E">${s.fieldCount}</span></div>
                <div class="total"><span>Beds needed</span><span class="mono-font">${s.totalBeds}+</span></div>
              </div>
            </div>
          `;
        }).join("")}
      </div>

      <p class="footnote">
        This calendar is a planning reference: it repeats every year and shows what should go in the ground, not whether a bed is actually free today.
        Before you plant, confirm bed readiness and worker assignment in <strong>Ranch_AAB</strong>.
      </p>
    </div>
  `;

  /* Month detail modal */
  if (state.selectedMonth && monthDetail) {
    let groupsHtml = groupedDetail.map(({ group, items }) => {
      const gIcon = GROUP_ICON[group] || "leaf";
      const rows = items.map((item, i) => `
        <div class="crop-row" data-action="open-crop" data-crop-idx="${i}" data-group="${esc(group)}"
          style="border-top:${i === 0 ? "none" : "1px solid var(--line)"};border-left:4px solid ${GROUP_COLOR[group]}">
          <div class="left">
            <span class="crop-emoji">${CROP_ICON[item.crop] || "🌱"}</span>
            <div>
              <div class="crop-name">${esc(item.crop)}</div>
              <div class="crop-window">${esc(item.window)}</div>
            </div>
          </div>
          <div class="right">
            <span class="crop-beds mono-font">${esc(item.beds)}</span>
            ${icon("chevronRight", 16)}
          </div>
        </div>
      `).join("");
      return `
        <div class="group-block">
          <div class="group-head" style="color:${GROUP_COLOR[group]}">
            ${icon(gIcon, 16)}
            <span class="group-title display-font">${esc(group)}</span>
          </div>
          <div class="group-list">${rows}</div>
        </div>
      `;
    }).join("");

    html += `
      <div class="modal-overlay" data-action="close-month">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="modal-header">
            <div>
              <div class="modal-eyebrow">Planting for</div>
              <h2 class="modal-title display-font">${esc(state.selectedMonth)}</h2>
            </div>
            <button class="close-btn" data-action="close-month">${icon("x", 22)}</button>
          </div>
          <div class="modal-body">
            ${renderFieldMap(zoneStats, state.mapZoneFilter)}
            ${state.mapZoneFilter ? `
              <div class="zone-pill">
                Showing only <strong style="margin-left:3px;margin-right:3px">${esc((ZONE_INFO[state.mapZoneFilter] && ZONE_INFO[state.mapZoneFilter].full) || state.mapZoneFilter)}</strong>
                <button data-action="clear-zone">${icon("x", 13)}</button>
              </div>
            ` : ""}
            ${groupsHtml}
          </div>
        </div>
      </div>
    `;
  }

  /* Crop detail modal */
  if (state.selectedCrop) {
    const c = state.selectedCrop;
    const zoneGroup = ZONE_INFO[c.zone] && ZONE_INFO[c.zone].group;
    html += `
      <div class="modal-overlay" data-action="close-crop">
        <div class="modal-card" style="max-width:460px" onclick="event.stopPropagation()">
          <div class="crop-detail-header">
            <div class="crop-detail-title-row">
              <span class="crop-detail-emoji">${CROP_ICON[c.crop] || "🌱"}</span>
              <h2 class="crop-detail-title display-font">${esc(c.crop)}</h2>
            </div>
            <button class="close-btn" data-action="close-crop">${icon("x", 20)}</button>
          </div>
          <div class="crop-detail-body">
            ${renderDetailRow("sprout", "What", c.crop, `Planting method: ${c.method}`)}
            ${renderDetailRow("calendar", "When", `${c.m} — ${c.window}`, "Recurs the same way every year.")}
            ${renderDetailRow(GROUP_ICON[zoneGroup] || "mapPin", "Where", (ZONE_INFO[c.zone] && ZONE_INFO[c.zone].full) || c.zone, `Zone code on paperwork: ${c.zone}`, GROUP_COLOR[zoneGroup])}
            ${renderDetailRow("leaf", "How many", c.beds, "Growing beds to set aside for this planting.")}
            <div class="cohort-note">
              <strong style="color:var(--ink)">Cohort code pattern:</strong> <span class="mono-font">${esc(c.coh)}</span><br />
              This becomes the batch's tracking ID — crop, planting year, then a batch number filled in once the round is actually planted in Ranch_AAB.
            </div>
          </div>
        </div>
      </div>
    `;
  }

  /* Glossary modal */
  if (state.showGlossary) {
    html += `
      <div class="modal-overlay" data-action="close-glossary">
        <div class="modal-card" style="max-width:520px" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h2 class="glossary-title display-font">Terms used on this calendar</h2>
            <button class="close-btn" data-action="close-glossary">${icon("x", 20)}</button>
          </div>
          <div class="glossary-body">
            ${GLOSSARY.map((g) => `
              <div class="glossary-row">
                <div class="glossary-term mono-font">${esc(g.term)}</div>
                <div class="glossary-meaning">${esc(g.meaning)}</div>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    `;
  }

  document.getElementById("app").innerHTML = html;

  // Stash current monthDetail items (post-filter, grouped order) for crop click lookups
  window.__groupedDetail = groupedDetail;
}

/* ---------- Event delegation ---------- */
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.getAttribute("data-action");

  if (action === "open-month") {
    state.selectedMonth = target.getAttribute("data-month");
    state.mapZoneFilter = null;
    render();
  } else if (action === "close-month") {
    state.selectedMonth = null;
    state.mapZoneFilter = null;
    render();
  } else if (action === "open-crop") {
    const group = target.getAttribute("data-group");
    const idx = parseInt(target.getAttribute("data-crop-idx"), 10);
    const groupEntry = (window.__groupedDetail || []).find((g) => g.group === group);
    if (groupEntry && groupEntry.items[idx]) {
      state.selectedCrop = groupEntry.items[idx];
      render();
    }
  } else if (action === "close-crop") {
    state.selectedCrop = null;
    render();
  } else if (action === "open-glossary") {
    state.showGlossary = true;
    render();
  } else if (action === "close-glossary") {
    state.showGlossary = false;
    render();
  } else if (action === "refresh") {
    loadSheet();
  } else if (action === "zone-click") {
    const zone = target.getAttribute("data-zone");
    state.mapZoneFilter = state.mapZoneFilter === zone ? null : zone;
    render();
  } else if (action === "clear-zone") {
    state.mapZoneFilter = null;
    render();
  }
});

render();
loadSheet();
</script>
</body>
</html>
