  :root{

  .display-font{font-family:'Roboto Slab',serif}
  .mono-font{font-family:'IBM Plex Mono',monospace}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .title-row{display:flex;align-items:center;gap:10px}
  h1{font-size:26px;font-weight:700;color:var(--greenDark);margin:0}
  .sub{color:var(--inkSoft);margin-top:6px;font-size:14.5px;max-width:560px;line-height:1.5}
  .source-line{display:flex;align-items:center;gap:8px;margin-bottom:22px;font-size:12.5px;color:var(--inkSoft)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
  .hero{background:var(--greenDark);border-radius:8px;padding:18px 22px;margin-bottom:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:var(--paper)}
  .hero-label{font-size:11px;letter-spacing:.06em;color:#C9C4A8}
  .hero-month{font-size:19px;font-weight:700}
  .hero-text{flex:1;min-width:240px;font-size:13.5px;line-height:1.55;color:#DCD8C0}
  .btn{background:var(--mustard);color:var(--greenDark);border:none;border-radius:6px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px 16px 14px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(38,47,31,.18)}
  .card.empty{opacity:.55}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .swatch{width:9px;height:9px;border-radius:50%;display:inline-block}
  .card-month{font-size:18px;font-weight:700;color:var(--greenDark)}
  .stamp{position:absolute;top:10px;right:-6px;transform:rotate(8deg);border:2px dashed var(--clay);color:var(--clay);font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:3px;background:rgba(168,71,46,.06)}
  .row{display:flex;justify-content:space-between;font-size:13px;color:var(--inkSoft);margin-bottom:5px}
  .row b{color:var(--ink)}
  .none-row{font-size:12.5px;color:var(--inkSoft);font-style:italic;padding-top:2px}
  .foot-note{font-size:12.5px;color:var(--inkSoft);margin-top:22px;line-height:1.6;max-width:720px}
  .overlay{position:fixed;inset:0;background:rgba(38,47,31,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:var(--paper);border-radius:8px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .modal-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:flex-start}
  .modal-eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--inkSoft)}
  .modal-title{font-size:23px;font-weight:700;color:var(--greenDark);margin:2px 0 0}
  .close{background:none;border:none;cursor:pointer;color:var(--inkSoft);font-size:20px;line-height:1;padding:4px}
  .modal-body{padding:14px 24px 24px}
  .group-head{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
  .group-name{font-weight:700;font-size:14px}
  .cohort-list{border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .cohort-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;border-top:1px solid var(--line)}
  .cohort-row:first-child{border-top:none}
  .cohort-row:hover{background:var(--bg)}
  .gap-note{background:var(--bg);border-radius:6px;padding:12px 14px;font-size:12.5px;color:var(--inkSoft);line-height:1.55;margin-top:16px}
  .empty-state{text-align:center;padding:30px 10px;color:var(--inkSoft);font-size:13.5px}
  .field-detail{display:flex;flex-direction:column;gap:14px;padding:20px 24px 24px}
  .fd-row{display:flex;gap:12px}
  .fd-icon{width:32px;height:32px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
  .fd-label{font-size:11px;letter-spacing:.06em;color:var(--inkSoft);margin-bottom:2px}
  .fd-val{font-size:14.5px;font-weight:600;color:var(--ink)}
  .fd-sub{font-size:12.5px;color:var(--inkSoft);margin-top:1px}
</style>

  return map;
}

            <h1 class="display-font">Ngapori Ranch Planting Calendar</h1>
          </div>
          <p class="sub">What's actually scheduled to go in the ground, straight from VPOS <code>COHORT_MASTER</code>. Click a month to see its cohorts.</p>
        </div>
      </div>
      <div class="source-line"><span class="dot"></span> Snapshot from Ranch_Vegetable_VPOS_MASTER_v2026.xlsx — ${COHORTS.length} scheduled cohorts, captured ${SNAPSHOT_DATE}. Not live — re-upload the workbook and ask me to refresh this file to update it.</div>

      <div class="hero">
        <div>
          <div class="hero-label">THIS MONTH</div>
          <div class="hero-month display-font">${MONTHS[curM]}</div>
        </div>
        <div class="hero-text">
          ${curCohorts.length
            ? `${curCohorts.length} cohort${curCohorts.length===1?'':'s'} scheduled to plant this month.`
            : `No cohorts are currently scheduled to plant this month. Wave 01 cohorts are all dated in September 2026.`}
        </div>
        <button class="btn" onclick="window.__openMonth(${curM})">See this month's work →</button>
      </div>

      <div class="grid">
        ${MONTHS.map((m,i) => {
          const list = grouped[i];
          const empty = list.length === 0;
          const blocks = [...new Set(list.map(c=>c.block_id))];
          return `
            <div class="card ${empty?'empty':''}" onclick="window.__openMonth(${i})">
              ${i===curM ? '<div class="stamp">CURRENT</div>' : ''}
              <div class="card-head">
                <span class="swatch" style="background:${empty ? '#9a967e' : (BLOCK_COLORS[blocks[0]]||'#3C5A3E')}"></span>
                <span class="card-month">${m}</span>
              </div>
              ${empty
                ? `<div class="none-row">No cohorts scheduled yet</div>`
                : `
                  <div class="row"><span>Cohorts planting</span><b>${list.length}</b></div>
                  <div class="row"><span>Blocks involved</span><b>${blocks.length}</b></div>
                  <div class="row"><span>Beds assigned</span><b>${list.filter(c=>c.assigned_beds.length).length} of ${list.length}</b></div>
                `
              }
            </div>
          `;
        }).join('')}
      </div>

      <p class="foot-note">This calendar shows only cohorts that actually exist in <code>COHORT_MASTER</code> today — it does not repeat or project a template onto future years. Right now that's Wave 01: 37 test cohorts, all planted in September 2026, all in open-field blocks. Greenhouse and High Tunnel cohorts, and any planting beyond Wave 01, will appear here automatically once they're added to the sheet. All 37 cohorts now have a bed linked via <code>Current_Cohort_ID</code> in <code>BED_MASTER</code>. The Phase 2 block reconciliation against <code>CROP_ZONING_REFERENCE</code> has been applied: Broccoli/Cauliflower moved from Block 2 to Block 3 (25% max brassica maturity rule), Onions moved from Block 3 to Block 2, Sweet Potatoes/Yams/Carrots/Beets/Turnips/Amaranth moved to Block 4, and Cassava/Asparagus/Plantains moved to the non-rotational Zone 5 no-till beds. Note: Amaranth's move to Block 4 was a business decision, not a value drawn directly from <code>CROP_ZONING_REFERENCE</code>, which doesn't list it under any block. Before you plant, confirm bed readiness and worker assignment in the VPOS system (<code>Ranch_Vegetable_VPOS_MASTER</code>).</p>
    </div>

    <div id="monthOverlay"></div>
    <div id="cohortOverlay"></div>
  `;
  renderMonthModal();
  renderCohortModal();
}

function renderMonthModal(){
  const el = document.getElementById('monthOverlay');
  if (state.monthIdx === null) { el.innerHTML=''; return; }
  const mi = state.monthIdx;
  const list = grouped[mi];
  const byBlock = {};
  list.forEach(c => { (byBlock[c.block_id] ||= []).push(c); });
  const blocks = Object.keys(byBlock).sort();

  el.innerHTML = `
    <div class="overlay" onclick="window.__closeMonth(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
          <div>
            <div class="modal-eyebrow">PLANTING FOR</div>
            <h2 class="modal-title display-font">${MONTHS[mi]}</h2>
          </div>
          <button class="close" onclick="window.__closeMonth()">✕</button>
        </div>
        <div class="modal-body">
          ${list.length === 0
            ? `<div class="empty-state">No cohorts are scheduled to plant in ${MONTHS[mi]} yet.<br/>This will fill in automatically as new cohorts are added to COHORT_MASTER.</div>`
            : blocks.map(b => `
                <div class="group-head">
                  <span class="swatch" style="background:${BLOCK_COLORS[b]}"></span>
                  <span class="group-name" style="color:${BLOCK_COLORS[b]}">${BLOCK_LABELS[b] || b}</span>
                </div>
                <div class="cohort-list">
                  ${byBlock[b].map(c => `
                    <div class="cohort-row" style="border-left:4px solid ${BLOCK_COLORS[b]}" onclick='window.__openCohort(${JSON.stringify(c.cohort_id)})'>
                      <div style="display:flex;align-items:center;gap:10px">
                        <span style="font-size:19px">${CROP_EMOJI[c.crop_name] || '🌱'}</span>
                        <div>
                          <div style="font-weight:600;font-size:14px">${c.crop_name}</div>
                          <div style="font-size:12px;color:var(--inkSoft)">Plant ${fmtDate(c.planting_date)}</div>
                        </div>
                      </div>
                      <div style="display:flex;align-items:center;gap:10px">
                        <span class="mono-font" style="font-size:11px;color:${c.assigned_beds.length ? 'var(--green)' : 'var(--clay)'}">${c.assigned_beds.length ? c.assigned_beds.join(', ') : 'no bed yet'}</span>
                        <span class="mono-font" style="font-size:11.5px;color:var(--inkSoft)">${c.cohort_id}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `).join('')
          }
        </div>
      </div>
    </div>
  `;
}

function renderCohortModal(){
  const el = document.getElementById('cohortOverlay');
  const c = state.cohort;
  if (!c) { el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="overlay" onclick="window.__closeCohort(event)">
      <div class="modal" style="max-width:460px" onclick="event.stopPropagation()">
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:24px">${CROP_EMOJI[c.crop_name] || '🌱'}</span>
            <h2 class="modal-title display-font" style="font-size:20px">${c.crop_name}</h2>
          </div>
          <button class="close" onclick="window.__closeCohort()">✕</button>
        </div>
        <div class="field-detail">
          <div class="fd-row"><div class="fd-icon">🌱</div><div><div class="fd-label">COHORT</div><div class="fd-val mono-font" style="font-size:13px">${c.cohort_id}</div><div class="fd-sub">Status: ${c.status}</div></div></div>
          <div class="fd-row"><div class="fd-icon">📅</div><div><div class="fd-label">PLANTING → EXPECTED HARVEST</div><div class="fd-val">${fmtDate(c.planting_date)} → ${fmtDate(c.expected_harvest_date)}</div><div class="fd-sub">${c.cycle_days ? c.cycle_days + ' day cycle (CROP_REFERENCE midpoint)' : ''}</div></div></div>
          <div class="fd-row"><div class="fd-icon">📍</div><div><div class="fd-label">BLOCK & ENVIRONMENT</div><div class="fd-val">${BLOCK_LABELS[c.block_id] || c.block_id}</div><div class="fd-sub">Environment: ${c.environment}</div></div></div>
          <div class="fd-row"><div class="fd-icon">💧</div><div><div class="fd-label">IRRIGATION PROFILE</div><div class="fd-val mono-font" style="font-size:13px">${c.irrigation_profile_id}</div></div></div>
          <div class="fd-row"><div class="fd-icon">🛏️</div><div><div class="fd-label">ASSIGNED BEDS</div><div class="fd-val mono-font" style="font-size:13px">${c.assigned_beds.length ? c.assigned_beds.join(', ') : '— none yet —'}</div><div class="fd-sub">${c.assigned_beds.length ? 'From BED_MASTER Current_Cohort_ID' : 'Not yet linked in BED_MASTER'}</div></div></div>
        </div>
      </div>
    </div>
  `;
}

window.__openMonth = (i) => { state.monthIdx = i; renderMonthModal(); };
window.__closeMonth = (e) => { if (e && e.target !== e.currentTarget) return; state.monthIdx = null; renderMonthModal(); };
window.__openCohort = (id) => { state.cohort = COHORTS.find(c => c.cohort_id === id); renderCohortModal(); };
window.__closeCohort = (e) => { if (e && e.target !== e.currentTarget) return; state.cohort = null; renderCohortModal(); };

render();
</script>
</body>
</html>
